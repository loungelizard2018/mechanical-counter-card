name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify JavaScript version matches tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -Fq 'const MECHANICAL_COUNTER_VERSION = "'"${VERSION}"'";' mechanical-counter-card.js

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ./*.js \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
